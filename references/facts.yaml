elementary_charge:
  value: "1.60 × 10⁻¹⁹ C"
  note: 전자·양성자 전하량의 크기. 크기는 같고 부호만 반대
  source: "OpenStax College Physics 2e, 18.1"
  verified: 2026-10-12
  used_in: ["01"]
proton_electron_mass_ratio:
  value: "약 1836"
  note: 양성자는 전자보다 약 1836배 무겁다 → '전자는 수천 배 가볍다'
  source: "NIST CODATA (physics.nist.gov/cgi-bin/cuu/Value?mpsme)"
  verified: null         # 널리 알려진 값이나 NIST 페이지 직접 확인은 아직
  used_in: ["01"]
electron_drift_speed:
  value: "4.53 × 10⁻⁴ m/s (약 0.45 mm/s)"
  note: |
    OpenStax 예제 20.3 — 12게이지(지름 2.053 mm) 구리선, 20.0 A, 자유전자 밀도 8.342×10²⁸ /m³.
    신호는 10⁸ m/s 수준으로 전하 자체보다 약 10¹²배 빠르다.
  source: "OpenStax College Physics 2e, 20.1 예제 20.3"
  verified: 2026-10-12
  used_in: ["01"]
