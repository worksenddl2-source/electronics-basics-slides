household_voltage:
  value: "220 V, 60 Hz"
  note: 한국 가정용 전원. 110V→220V 승압 사업은 1973년 시작, 2005년 완료
  source:
    - "삼성전자서비스 고객지원: 국내 제품은 220V/60Hz 전원환경 기준 (samsungsvc.co.kr/solution/121310)"
    - "경향신문 2005-11-03 승압사업 완료 기사 (khan.co.kr/article/200511031803461)"
